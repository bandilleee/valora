name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: TypeScript — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Test
        run: pnpm turbo test

  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline
    # Postgres 17, matching local (docker-compose.yml). M1.9's exclusion-
    # constraint regression test needs a real database — this cannot be
    # mocked without defeating the point of the test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: valora
          POSTGRES_USER: valora
          POSTGRES_PASSWORD: valora
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      # Required by valora_pipeline.config.Settings. No real credentials —
      # DATABASE_URL points at the postgres service above, matching the same
      # local defaults used everywhere else in this repo.
      DATABASE_URL: postgres://valora:valora@localhost:5432/valora
      AWS_REGION: af-south-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: valora-documents-dev
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked

      # The dbmate wrapper, not duplicated SQL — same migrations, same tool,
      # same version pin as local. Run from repo root: the wrapper resolves
      # db/migrations relative to itself, and services.postgres's health
      # check has already gated this step on the DB being ready.
      - name: Apply migrations
        working-directory: ${{ github.workspace }}
        run: ./scripts/dbmate.sh up

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
