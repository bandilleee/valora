[project]
name = "valora-pipeline"
version = "0.0.0"
description = "Valora extraction pipeline"
readme = "README.md"
requires-python = ">=3.12"
# Not published to any index.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pydantic-settings>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "psycopg[binary]>=3.3.4",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true
